name: Publish and Deploy

on:
   push:
      branches: ["main"]
   workflow_dispatch: {}

# Prevent overlapping runs on main to keep deploys orderly
concurrency:
   group: publish-deploy-main
   cancel-in-progress: false

jobs:
   docker-publish:
      name: Docker Publish
      uses: ./.github/workflows/docker-publish.yml
      secrets: inherit

   wait-registry:
      name: Wait for registry propagation
      runs-on: ubuntu-latest
      needs: docker-publish
      steps:
         - name: Sleep to allow Docker registry update
           run: sleep 15

   deploy-webserver:
      name: Deploy Webserver
      needs: wait-registry
      uses: ./.github/workflows/deploy-webserver.yml
      secrets: inherit
